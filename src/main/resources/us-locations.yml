# Real US city / state / ZIP reference data, shared by the Candidate and JobPosting providers.
#
# Every entry is a genuine US Postal Service city name, its state abbreviation, and ZIP codes
# actually assigned to that city. Providers draw one entry and then one of its ZIPs, so the
# generated city / state / ZIP triple is always geographically coherent.
#
# Street addresses are deliberately NOT drawn from here — they stay synthetic, so a generated
# address can never resolve to a real mailbox.
#
# Coverage: all 50 states plus DC, at least two cities each.
#
# Every ZIP below was verified against a public postal lookup: all resolve to an assigned ZIP in
# the stated state. A handful carry a different USPS *default* city name than the municipality
# (Overland Park KS ZIPs default to "Shawnee Mission"; Winston-Salem is spelled without the
# hyphen) — these are naming conventions, not mismatches.
#
# To add a city: append an entry below. No Java changes are needed. The loader validates at
# class-init that state is a real USPS abbreviation and every ZIP is five digits.

